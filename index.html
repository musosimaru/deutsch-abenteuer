    ru:{heroEye:'НЕМЕЦКИЙ · 3-Й КЛАСС',heroTitle:'Учиться — это игра!',heroCopy:'Слушай, выбирай, собирай предложения и получай звёзды. Задания основаны на страницах учебной тетради.',choose:'Выбирай приключение',chooseSmall:'6 тем и итоговое испытание',play:'Начать',challenge:'Супермикс',challengeCopy:'Случайные задания из всех тем',max:'Баллы',back:'← Все темы',round:'Задание',of:'из',listen:'Послушай по-немецки',hearAgain:'🔊 Послушать ещё',audioNotAvailable:'Немецкая озвучка недоступна в этом браузере. После ответа можно увидеть текст.',mcq:'ВЫБЕРИ ОТВЕТ',mcqQ:'Как сказать по-немецки?',listenType:'СЛУШАЙ И УЗНАВАЙ',listenQ:'Что ты услышал?',orderType:'СОБЕРИ ФРАЗУ',orderQ:'Расположи слова в правильном порядке',gapType:'ВСТАВЬ СЛОВО',gapQ:'Какого слова не хватает?',tapWords:'Нажимай на слова в правильном порядке.',builtHint:'Здесь появится твоя фраза…',great:'Правильно! Молодец! ✨',almost:'Пока не совсем, но ты учишься! 💜',correct:'Правильный ответ:',check:'Проверить',next:'Продолжить →',finish:'Результат →',undo:'↩ Убрать последнее',done:'Миссия выполнена!',greatResult:'Замечательно! Ты отлично потренировался.',okResult:'Хорошая тренировка! С каждым разом получается лучше.',points:'Верных ответов',retry:'Играть снова',home:'Ко всем темам',mistakes:'Разбор ответов',youChose:'Твой ответ:',stars:'Звёзды',offline:'Работает без интернета. Результаты сохраняются только на этом устройстве.',progress:'Твои звёзды',noAudio:'Показать подсказку',reveal:'Немецкая фраза:',reset:'Сбросить прогресс',resetConfirm:'Удалить результаты на этом устройстве?',soon:'Удачи!'}
  };
  const app=document.querySelector('#app');
  let lang='it',state=null,progress={};
  try{lang=localStorage.getItem('deutsch-lang')||'it';if(!texts[lang])lang='it';progress=JSON.parse(localStorage.getItem('deutsch-progress')||'{}')||{}}catch(e){}
  const t=k=>texts[lang][k]||k;
  const pick=(obj)=>lang==='it'?obj.it:obj.ru;
  const escapeHTML=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const shuffle=(arr)=>{let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const sample=(arr,n)=>shuffle(arr).slice(0,n);
  const baseWords=(lesson)=>lesson.words.map(([de,it,ru])=>({de,it,ru}));
  const fullText=word=>word.join(' ');
  const totalStars=()=>Object.values(progress).reduce((sum,v)=>sum+(v.stars||0),0);
  const stored=()=>{try{localStorage.setItem('deutsch-progress',JSON.stringify(progress));localStorage.setItem('deutsch-lang',lang)}catch(e){}};
  function header(){return `<header class="topbar"><div class="brand"><span class="brandmark" aria-hidden="true">🦊</span> Deutsch-Abenteuer</div><div class="toptools"><span class="chip">⭐ <span id="starcount">${totalStars()}</span> ${t('stars')}</span><select id="language" class="lang" aria-label="Lingua interfaccia / Язык интерфейса"><option value="it" ${lang==='it'?'selected':''}>Italiano</option><option value="ru" ${lang==='ru'?'selected':''}>Русский</option></select></div></header>`}
  function bindHeader(){if(window.twemoji)window.twemoji.parse(app,{base:'https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/',folder:'svg',ext:'.svg'});document.querySelector('#language').addEventListener('change',e=>{lang=e.target.value;stored();render()})}
  function home(){state=null;const html=lessons.map(l=>{const p=progress[l.id]||{};return `<button class="lesson" data-lesson="${l.id}" style="--tile:${l.tile}" aria-label="${escapeHTML(l.name)}: ${t('play')}"><span class="lessonemoji">${l.emoji}</span><span class="name">${escapeHTML(l.name)}</span><span class="detail">${escapeHTML(pick(l))}</span><span class="bottom"><span class="stars" aria-label="${p.stars||0} ${t('stars')}">${'★'.repeat(p.stars||0)}${'☆'.repeat(3-(p.stars||0))}</span><span class="arrow">→</span></span></button>`}).join('');
    app.innerHTML=header()+`<section class="hero"><div><div class="eyebrow">${t('heroEye')}</div><h1>${t('heroTitle')}</h1><p>${t('heroCopy')}</p></div><div class="hero-art" aria-hidden="true">🦉📚</div></section><div class="subheading"><h2>${t('choose')}</h2><small>${t('chooseSmall')}</small></div><section class="lessons" aria-label="${t('choose')}">${html}<button class="lesson mix" data-lesson="mix" style="--tile:#ffe2a4"><span class="lessonemoji">🏆</span><span class="name">${t('challenge')}</span><span class="detail">${t('challengeCopy')}</span><span class="bottom"><span class="stars">${'★'.repeat(progress.mix?.stars||0)}${'☆'.repeat(3-(progress.mix?.stars||0))}</span><span class="arrow">→</span></span></button></section><p class="footer-note">${t('offline')}<br><button id="reset" class="button-secondary" style="margin-top:13px;font-size:12px;padding:8px 12px;min-height:0">${t('reset')}</button></p>`;
    bindHeader();app.querySelectorAll('[data-lesson]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.lesson)));app.querySelector('#reset').addEventListener('click',()=>{if(confirm(t('resetConfirm'))){progress={};stored();home()}})}
  function buildDeck(lessonId){
    const relevant=lessonId==='mix'?lessons:lessons.filter(l=>l.id===lessonId);
    let bank=[];
    for(const l of relevant){
      const words=baseWords(l);
      const wordCards=sample(words,lessonId==='mix'?2:4);
      for(const w of wordCards){
        const opts=shuffle([w,...sample(words.filter(v=>v.de!==w.de),Math.min(3,words.length-1))]);
        bank.push({type:'mcq',lesson:l.id,answer:w.de,options:opts.map(v=>v.de),meaningObj:w,de:w.de})
      }
      for(const w of sample(words,lessonId==='mix'?2:3)){
        let opts=shuffle([w,...sample(words.filter(v=>v.de!==w.de),3)]);
        bank.push({type:'listen',lesson:l.id,answer:w.de,options:opts.map(v=>v.de),de:w.de,meaningObj:w})
      }
      for(const sentence of sample(l.orders,lessonId==='mix'?2:3)){
        const de=fullText(sentence);const w=words.find(x=>x.de===de||x.de===de.replace(/[!.?]$/,''))||words.find(x=>x.de.replace(/[!.?]$/,'')===de.replace(/[!.?]$/,''));
        bank.push({type:'order',lesson:l.id,answer:de,parts:sentence.map((v,i)=>({id:i,text:v})),de,meaningObj:w||null})
      }
      for(const g of sample(l.gaps,lessonId==='mix'?2:3)){
        bank.push({type:'gap',lesson:l.id,answer:g.answer,options:shuffle(g.opts),before:g.before,after:g.after,de:g.before+g.answer+g.after,meaningObj:g})
      }
    }
    // Balanced session: 8 exercises in a lesson, 12 for the final challenge.
    if(lessonId==='mix'){
      const byType={};for(const q of shuffle(bank))(byType[q.type]??=[]).push(q);
      return shuffle(['mcq','mcq','mcq','listen','listen','listen','gap','gap','gap','order','order','order'].map(k=>byType[k].shift()));
    }
    const byType={};for(const q of shuffle(bank))(byType[q.type]??=[]).push(q);
    return shuffle(['mcq','mcq','listen','listen','gap','gap','order','order'].map(k=>byType[k].shift()));
  }
  function start(id){if('speechSynthesis' in window)try{speechSynthesis.cancel()}catch(e){};state={lesson:id,deck:buildDeck(id),idx:0,score:0,review:[],locked:false,chosen:[],hint:false,choice:null};render();window.scrollTo({top:0,behavior:'smooth'})}
  function speak(text){if(!('speechSynthesis' in window)){return false}try{
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.82;u.pitch=1.04;
    const voices=speechSynthesis.getVoices();const de=voices.find(v=>v.lang.toLowerCase().startsWith('de-')&&v.localService)||voices.find(v=>v.lang.toLowerCase().startsWith('de'));if(de)u.voice=de;
    speechSynthesis.speak(u);return true
  }catch(e){return false}}
  function current(){return state.deck[state.idx]}
  function meaning(q){return q.meaningObj?pick(q.meaningObj):''}
  function render(){if(!state){home();return}if(state.idx>=state.deck.length){result();return}question()}
  function question(){const q=current();const index=state.idx+1;const total=state.deck.length;const l=lessons.find(l=>l.id===state.lesson);
    let intro='',body='';const typeTag={mcq:t('mcq'),listen:t('listenType'),order:t('orderType'),gap:t('gapType')}[q.type];
    if(q.type==='mcq'){intro=`<div class="question">${t('mcqQ')}</div><p class="hint">${escapeHTML(meaning(q))}</p>`;body=options(q)}
    if(q.type==='listen'){intro=`<div class="question">${t('listenQ')}</div><p class="hint">${t('listen')}:</p><button class="big-audio" id="audio"><span class="speaker">🔊</span>${t('hearAgain')}</button> <button class="inline-audio" id="revealHint">💡 ${t('noAudio')}</button>${state.hint?`<div class="translation">${t('reveal')} <b>${escapeHTML(q.de)}</b></div>`:''}`;body=options(q)}
    if(q.type==='gap'){intro=`<div class="question">${t('gapQ')}</div><p class="hint">${escapeHTML(meaning(q))}</p><div class="sentence-blank">${escapeHTML(q.before)}<strong>${state.choice?escapeHTML(state.choice):'…'}</strong>${escapeHTML(q.after)}</div>`;body=options(q)}
    if(q.type==='order'){intro=`<div class="question">${t('orderQ')}</div><p class="hint">${escapeHTML(meaning(q)||t('tapWords'))}</p><div class="built" id="built">${state.chosen.length?state.chosen.map(id=>`<button class="word placed" data-remove="${id}" ${state.locked?'disabled':''}>${escapeHTML(q.parts[id].text)}</button>`).join(''):`<span class="placeholder">${t('builtHint')}</span>`}</div>`;body=`<div class="wordbank">${shuffleForCurrent(q).filter(p=>!state.chosen.includes(p.id)).map(p=>`<button class="word" data-pick="${p.id}" ${state.locked?'disabled':''}>${escapeHTML(p.text)}</button>`).join('')||'<span class="placeholder">✓</span>'}</div>`}
    const label=state.lesson==='mix'?t('challenge'):l.name;
    app.innerHTML=header()+`<button class="back" id="back">${t('back')}</button><div class="game-top"><div><div class="game-title">${escapeHTML(label)} ${state.lesson==='mix'?'🏆':l.emoji}</div><div class="game-sub">${t('round')} ${index} ${t('of')} ${total}</div></div><div class="game-counter">⭐ ${state.score} ${t('max')}</div></div><div class="bar" role="progressbar" aria-valuenow="${state.idx}" aria-valuemin="0" aria-valuemax="${total}"><div style="width:${100*state.idx/total}%"></div></div><section class="game-card"><div class="question-type">${typeTag}</div>${intro}${body}<div id="feedback" aria-live="polite">${state.locked?feedbackMarkup(q):''}</div><div class="game-controls"><div>${q.type==='order'&&!state.locked?`<button class="button-secondary" id="undo" ${state.chosen.length?'':'disabled'}>${t('undo')}</button>`:''}</div><button id="primary" class="button-primary" ${state.locked||(q.type==='order'&&state.chosen.length===q.parts.length)||(q.type!=='order'&&!!state.choice)?'':'disabled'}>${state.locked?(index===total?t('finish'):t('next')):t('check')}</button></div></section>`;
    bindHeader();app.querySelector('#back').addEventListener('click',()=>{if('speechSynthesis' in window)try{speechSynthesis.cancel()}catch(e){};home()});
    if(q.type==='listen'){app.querySelector('#audio').addEventListener('click',()=>{if(!speak(q.de))alert(t('audioNotAvailable'))});app.querySelector('#revealHint').addEventListener('click',()=>{state.hint=!state.hint;question()})}
    if(q.type==='order'){app.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>{state.chosen.push(Number(el.dataset.pick));question()}));app.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{state.chosen=state.chosen.filter(id=>id!==Number(el.dataset.remove));question()}));const undo=app.querySelector('#undo');if(undo)undo.addEventListener('click',()=>{state.chosen.pop();question()})}
    else{app.querySelectorAll('[data-option]').forEach(el=>el.addEventListener('click',()=>{if(state.locked)return;state.choice=el.dataset.option;question()}))}
    app.querySelector('#primary').addEventListener('click',()=>state.locked?next():check())
  }
  function shuffleForCurrent(q){if(!q.shuffled){q.shuffled=shuffle(q.parts)}return q.shuffled}
  function options(q){return `<div class="choices">${q.options.map(opt=>{let classes='choice';if(state.locked&&opt===q.answer)classes+=' right';else if(state.locked&&opt===state.choice)classes+=' wrong';else if(state.choice===opt)classes+=' selected';return `<button class="${classes}" data-option="${escapeHTML(opt)}" ${state.locked?'disabled':''} aria-pressed="${state.choice===opt?'true':'false'}">${escapeHTML(opt)}</button>`}).join('')}</div>`}
  function check(){const q=current();if(q.type==='order'&&!state.chosen.length||q.type!=='order'&&!state.choice)return;
    const response=q.type==='order'?state.chosen.map(id=>q.parts[id].text).join(' '):state.choice;
    const ok=response===q.answer;
    state.review.push({de:q.de,answer:q.answer,response,ok,type:q.type,meaningObj:q.meaningObj});if(ok)state.score++;state.locked=true;
    question();
    // Keep speech optional: user taps the replay button when desired.
  }
  function feedbackMarkup(q){const last=state.review[state.review.length-1];return `<div class="feedback ${last.ok?'good':'bad'}"><strong>${last.ok?t('great'):t('almost')}</strong>${last.ok?'':`<div>${t('correct')} <b>${escapeHTML(q.type==='gap'?q.de:q.answer)}</b></div>`}${q.type==='listen'?`<div class="translation">🔊 ${escapeHTML(q.de)}${meaning(q)?' — '+escapeHTML(meaning(q)):''}</div>`:''}</div>`}
  function next(){if('speechSynthesis' in window)try{speechSynthesis.cancel()}catch(e){};state.idx++;state.locked=false;state.chosen=[];state.hint=false;state.choice=null;render();window.scrollTo({top:0,behavior:'smooth'})}
  function result(){const pct=state.score/state.deck.length;const stars=pct>=.9?3:pct>=.65?2:pct>=.35?1:0;const id=state.lesson;const prev=progress[id]||{stars:0,best:0};if(!state.completed){progress[id]={stars:Math.max(prev.stars||0,stars),best:Math.max(prev.best||0,state.score),plays:(prev.plays||0)+1};state.completed=true;stored()}
    const mistakes=state.review.filter(x=>!x.ok);const markup=mistakes.map(m=>`<li><strong>${escapeHTML(m.de)}</strong>${m.meaningObj?`<span> — ${escapeHTML(pick(m.meaningObj))}</span>`:''}<div><span>${t('youChose')} ${escapeHTML(m.response)}</span></div></li>`).join('');
    app.innerHTML=header()+`<button class="back" id="back">${t('back')}</button><section class="game-card result"><div class="result-emoji">${pct>=.8?'🏆':pct>=.5?'🌟':'🌱'}</div><h2>${t('done')}</h2><p>${pct>=.6?t('greatResult'):t('okResult')}</p><div class="bigscore">${state.score} / ${state.deck.length} · ${t('points')}</div><div class="stars" style="font-size:37px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div class="result-actions"><button class="button-primary" id="again">↻ ${t('retry')}</button><button class="button-secondary" id="home">${t('home')}</button></div>${mistakes.length?`<details class="review"><summary>${t('mistakes')} (${mistakes.length})</summary><ol>${markup}</ol></details>`:''}</section>`;
    bindHeader();app.querySelector('#back').addEventListener('click',home);app.querySelector('#home').addEventListener('click',home);app.querySelector('#again').addEventListener('click',()=>start(id));
  }
  home();
  </script>
